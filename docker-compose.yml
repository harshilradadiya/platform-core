version: '3.8'

services:
  # High-performance caching layer
  redis:
    image: redis:7-alpine
    container_name: mediaflow-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediaflow-network

  # FastAPI Extraction and Streaming Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediaflow-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=MediaFlow SaaS
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - REDIS_CACHE_TTL_SECONDS=10800
      - RATE_LIMIT_PER_MINUTE=30
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - mediaflow-network

  # Next.js 14 SSR Frontend with Programmatic SEO
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediaflow-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mediaflow-network

networks:
  mediaflow-network:
    driver: bridge
